name: Verify KindHandoff
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run check
      - name: Verify isolated Firebase, MCP and login workflows
        run: npx --yes firebase-tools@15.30.1 emulators:exec --only auth,firestore --project demo-kindhandoff 'npm run test:firestore && node scripts/verify-local.mjs'
